<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다이즈하이미디어 그룹 공식 문서 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Asta+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<!-- 색상·폰트 변수(--navy, --font-kr, --font-en)와 기본 리셋은
     shared/styles/variables.css에서 공통으로 가져옵니다. 이 페이지만의
     레이아웃(그룹사 선택 + 템플릿 미리보기)은 아래 <style>에 남겨둡니다. -->
<link rel="stylesheet" href="shared/styles/variables.css">
<style>
  /* variables.css의 기본 배경(#e9edf3)을 포털 페이지 전용 배경으로 덮어씀 */
  body{
    background:#f4f6fa;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:60px 20px 40px;
  }

  /* ---------- 상단: 다이즈 로고 + 그룹 타이틀 ---------- */
  header{
    text-align:center;
    margin-bottom:44px;
  }
  .hero-logo{
    background-color:var(--navy);
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
    -webkit-mask-size:contain;mask-size:contain;
    margin:0 auto 18px;
  }
  header .eng{
    font-family:var(--font-en);
    color:#666;
    letter-spacing:2px;
    font-size:13px;
  }
  h1{
    color:var(--navy);
    margin:8px 0 0;
    font-size:25px;
  }
  header .lead{
    margin:10px 0 0;
    font-size:14px;
    color:var(--sub);
  }

  /* ---------- 그룹사 선택 카드 4개 ---------- */
  .company-grid{
    width:100%;
    max-width:720px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:16px;
    margin-bottom:8px;
  }
  /* ---------- 그룹사 선택 버튼(둥근 사각형 자체가 브랜드 컬러 바탕) ----------
     처음엔 흰 카드 안에 작은 원형 구슬 배지를 넣었었는데, 더 납작하고
     버튼 모서리 라운드 사각형 그대로가 바탕이 되는 형태로 변경했습니다.
     즉 .company-card 자체를 계열사 badgeColor(company-info.js)로 채우고,
     흰색 로고가 그 위에 살짝 돌출된(엠보싱) 느낌이 나도록 drop-shadow를
     겹쳐 입체감을 줍니다. 배경색은 인라인 style로 지정합니다. */
  .company-card{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border:none;
    border-radius:16px;
    padding:30px 16px;
    cursor:pointer;
    font-family:inherit;
    overflow:hidden;
    box-shadow:
      0 6px 16px rgba(15,20,35,.22),
      inset 0 1px 0 rgba(255,255,255,.2);
    transition:box-shadow .15s ease, transform .15s ease;
  }
  /* 위쪽에 살짝 밝은 유광 느낌만 얇게 — 구체가 아니라 납작한 판 위의
     은은한 광택이 되도록 그라데이션 폭을 넓고 옅게 잡았습니다. */
  .company-card::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,0) 60%);
    pointer-events:none;
  }
  .company-card:hover{
    box-shadow:
      0 10px 22px rgba(15,20,35,.28),
      inset 0 1px 0 rgba(255,255,255,.24);
    transform:translateY(-2px);
  }
  .company-card.active{
    box-shadow:
      0 0 0 3px #fff,
      0 0 0 5px var(--navy),
      0 10px 22px rgba(15,20,35,.3);
  }
  .company-logo{
    background-color:#fff;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
    -webkit-mask-size:contain;mask-size:contain;
    position:relative;
    z-index:1;
    /* 로고가 바탕에서 살짝 튀어나온 듯한 엠보싱 효과 — 아래쪽엔 진한
       그림자, 위쪽 가장자리엔 밝은 하이라이트를 겹쳐서 입체감을 줌 */
    filter:
      drop-shadow(0 2px 2px rgba(0,0,0,.35))
      drop-shadow(0 -1px 0 rgba(255,255,255,.35));
  }

  /* 회사명 텍스트는 화면에는 안 보이지만 스크린 리더 등 접근성 도구를
     위해 DOM에는 그대로 남겨둡니다(요청: "접근성을 위해서 정보만 남기고
     눈에는 로고만 보여도 됨"). */
  .sr-only{
    position:absolute;
    width:1px;height:1px;
    padding:0;margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  /* ---------- 하단: 선택한 그룹사의 문서 템플릿 ---------- */
  .template-panel{
    width:100%;
    max-width:880px;
    margin-top:28px;
  }
  .template-panel[hidden]{display:none;}

  /* 제목 줄과 필터 버튼을 한 줄에 — 좁은 화면에서는 줄바꿈되어
     필터가 제목 아래로 내려갑니다(flex-wrap). */
  .template-panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
  }
  .template-panel-head h2{
    font-size:15px;
    color:var(--sub);
    margin:0;
    font-weight:600;
  }
  .template-panel-head h2 b{color:var(--navy);}

  /* 항목별 필터(전체/공식서신/견적서/계약서 ...) — 새 카테고리가
     생기면 TEMPLATE_CATEGORIES 배열에만 추가하면 버튼이 자동으로
     늘어납니다. */
  .template-filter{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .filter-btn{
    font-family:var(--font-kr);
    font-size:12.5px;
    font-weight:600;
    color:var(--sub);
    background:#fff;
    border:1px solid #dde3ee;
    border-radius:999px;
    padding:6px 14px;
    cursor:pointer;
    transition:background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .filter-btn:hover{border-color:var(--navy);color:var(--navy);}
  .filter-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  /* 문서가 늘어나도 한눈에 훑어볼 수 있도록 리스트 대신 타일(그리드)
     형태로 배치 — 데스크톱 기준 5열, 좁은 화면에서는 열 수를
     줄입니다. */
  .template-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:14px;
  }
  @media (max-width:760px){
    .template-grid{grid-template-columns:repeat(3, 1fr);}
  }
  @media (max-width:480px){
    .template-grid{grid-template-columns:repeat(2, 1fr);}
  }

  .template-tile{
    display:flex;
    flex-direction:column;
    background:#fff;
    border:1px solid #e2e6ee;
    border-radius:10px;
    padding:10px;
    text-decoration:none;
    color:inherit;
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .template-tile:hover{
    box-shadow:0 6px 18px rgba(11,35,79,0.12);
    transform:translateY(-2px);
  }

  /* 실제 A4(가로 210mm × 세로 297mm) 비율을 그대로 축소한 미리보기 —
     문서 종류가 늘어도 이 클래스 하나로 항상 같은 비율을 유지합니다. */
  .tile-thumb{
    width:100%;
    aspect-ratio:210 / 297;
    background:#fff;
    border:1px solid #dde3ee;
    border-radius:5px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(20,30,60,0.08);
    margin-bottom:8px;
  }
  .thumb-band{height:24%;background:var(--navy);}
  .thumb-lines{padding:14% 14% 0;}
  .thumb-lines span{
    display:block;height:5px;background:#e2e6ee;border-radius:3px;margin-bottom:9px;
  }
  .thumb-lines span.w60{width:60%;}
  .thumb-lines span.w80{width:80%;}

  .tile-category{
    align-self:flex-start;
    font-size:10.5px;
    font-weight:700;
    color:var(--navy);
    background:#eef1f8;
    border-radius:4px;
    padding:2px 6px;
    margin-bottom:6px;
  }
  .tile-title{
    margin:0;
    font-size:12.5px;
    font-weight:600;
    line-height:1.4;
    color:var(--navy);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .template-empty{
    background:#fff;
    border:1px dashed #d3d9e6;
    border-radius:10px;
    padding:34px 20px;
    text-align:center;
  }
  .template-empty p{
    margin:0;
    font-size:14px;
    color:#888;
  }
  .template-empty p b{color:var(--sub);}

  footer{
    margin-top:48px;
    font-size:12px;
    color:#999;
    text-align:center;
  }
</style>
</head>
<body>
  <header>
    <div class="hero-logo" id="heroLogo"></div>
    <div class="eng">DISEHIMEDIA GROUP</div>
    <h1>다이즈하이미디어 그룹 공식 문서 시스템</h1>
    <p class="lead">그룹사를 선택하면 사용할 수 있는 문서 템플릿이 아래에 나타납니다.</p>
  </header>

  <div class="company-grid" id="companyGrid"></div>

  <div class="template-panel" id="templatePanel" hidden></div>

  <footer>&copy; DISEHIMEDIA GROUP. 내부 업무용 문서 시스템입니다. 제작 설정·기획 문서는 저장소의 docs/guide 폴더를 참고하세요.</footer>

  <!-- 계열사 정보(로고·이름)는 company-info.js 한 곳에서 관리합니다 —
       여기서는 그 값을 읽어 카드만 그립니다. 새 계열사가 추가되면
       company-info.js에 항목만 추가하면 이 페이지에도 자동으로 카드가
       늘어납니다. -->
  <script src="shared/scripts/company-info.js"></script>
  <script>
    // 항목별 필터 버튼 목록 — 새 문서 종류가 생기면 여기에 { key, label }
    // 만 추가하면 필터 버튼이 자동으로 늘어납니다. key는 아래
    // TEMPLATES_BY_COMPANY의 각 템플릿 항목이 갖는 category 값과
    // 일치해야 합니다('all'은 특수 키 — 전체 보기).
    var TEMPLATE_CATEGORIES = [
      { key: 'all', label: '전체' },
      { key: 'official', label: '공식서신' },
      { key: 'quote', label: '견적서' },
      { key: 'contract', label: '계약서' },
      { key: 'businesscard', label: '명함 서식' },
      { key: 'presentation', label: '프리젠테이션' }
    ];

    function categoryLabel(key) {
      var found = TEMPLATE_CATEGORIES.filter(function (cat) { return cat.key === key; })[0];
      return found ? found.label : '';
    }

    // 이 포털 페이지에서만 쓰는 "그룹사별 문서 템플릿" 목록 — 새 템플릿이
    // 생기면 해당 계열사 key 아래에 { title, desc, href, category }를
    // 추가하면 됩니다(category는 위 TEMPLATE_CATEGORIES의 key 중 하나).
    // 아직 템플릿이 없는 계열사는 항목을 만들지 않으면 자동으로 "곧
    // 생성됩니다" 안내가 나타납니다.
    var TEMPLATES_BY_COMPANY = {
      disehimedia: [
        {
          // 2026-09-02: "공문 (대외 발송용)" → "레터헤드 (영문)"으로 개편 —
          // 아래 "레터헤드 (국문)"과 같은 레터헤드 포맷의 영문판입니다.
          title: '레터헤드 (영문)',
          desc: '"레터헤드 (국문)"과 같은 레터헤드 양식을 영문으로 작성할 때 쓰는 공식 문서 템플릿입니다.',
          href: 'templates/gongmun/',
          category: 'official'
        },
        {
          // 2026-09-02: "공문 — 프리미엄 레터헤드" → "레터헤드 (국문)"으로 개편.
          title: '레터헤드 (국문)',
          desc: '헤더·푸터의 색을 빼고 다이즈블랙 로고만 남긴 고급스러운 국문 레터헤드 디자인입니다.',
          href: 'templates/gongmun-premium/',
          category: 'official'
        }
      ]
    };

    // 현재 선택된 그룹사/필터 — selectCompany()와 필터 버튼 클릭이 이
    // 값을 바꾸고, renderTemplatePanel()이 이 값을 기준으로 다시
    // 그립니다.
    var currentCompanyKey = null;
    var currentFilterKey = 'all';

    var LOGO_ROOT = 'shared/assets/logos/';

    function maskStyle(logoMark, heightPx, ratio) {
      var url = LOGO_ROOT + logoMark;
      var widthPx = Math.round(heightPx * (ratio || 1));
      return 'width:' + widthPx + 'px;height:' + heightPx + 'px;' +
        '-webkit-mask-image:url(\'' + url + '\');mask-image:url(\'' + url + '\');';
    }

    // ---- 상단 히어로 로고: 다이즈하이미디어 로고를 그룹 대표로 사용 ----
    var hero = DISE.companies.disehimedia;
    document.getElementById('heroLogo').setAttribute(
      'style', maskStyle(hero.logoMark, 44, hero.logoRatio)
    );

    // ---- 그룹사 카드 4개 ----
    var grid = document.getElementById('companyGrid');
    var companyKeys = Object.keys(DISE.companies);
    companyKeys.forEach(function (key) {
      var c = DISE.companies[key];
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'company-card';
      card.setAttribute('data-company', key);
      card.style.backgroundColor = c.badgeColor || 'var(--navy)';
      card.innerHTML =
        '<span class="company-logo" style="' + maskStyle(c.logoMark, 46, c.logoRatio) + '"></span>' +
        '<span class="company-name sr-only">' + c.nameEn +
          (c.nameKr && c.nameKr !== c.nameEn ? ' ' + c.nameKr : '') +
        '</span>';
      card.addEventListener('click', function () { selectCompany(key, card); });
      grid.appendChild(card);
    });

    // ---- 카드 클릭 시 하단 템플릿 패널 갱신 ----
    function selectCompany(key, card) {
      Array.prototype.forEach.call(grid.children, function (el) {
        el.classList.toggle('active', el === card);
      });
      currentCompanyKey = key;
      currentFilterKey = 'all'; // 그룹사를 바꾸면 필터도 "전체"로 초기화합니다.
      renderTemplatePanel();
    }

    // 현재 선택된 그룹사(currentCompanyKey)·필터(currentFilterKey)를
    // 기준으로 템플릿 패널 전체(제목 줄 + 필터 버튼 + 타일 그리드)를
    // 다시 그립니다. 필터 버튼을 누르면 currentFilterKey만 바꾸고 이
    // 함수를 다시 호출합니다.
    function renderTemplatePanel() {
      var c = DISE.companies[currentCompanyKey];
      var allTemplates = TEMPLATES_BY_COMPANY[currentCompanyKey] || [];
      var panel = document.getElementById('templatePanel');
      panel.hidden = false;

      if (!allTemplates.length) {
        panel.innerHTML =
          '<div class="template-empty"><p>현재 <b>' + c.nameKr + '</b>의 문서 템플릿은 없습니다. 곧 생성됩니다.</p></div>';
        return;
      }

      var filtered = currentFilterKey === 'all' ?
        allTemplates :
        allTemplates.filter(function (t) { return t.category === currentFilterKey; });

      panel.innerHTML =
        '<div class="template-panel-head">' +
          '<h2><b>' + c.nameKr + '</b>의 문서 템플릿</h2>' +
          '<div class="template-filter">' +
            TEMPLATE_CATEGORIES.map(function (cat) {
              return '<button type="button" class="filter-btn' + (cat.key === currentFilterKey ? ' active' : '') + '" data-filter="' + cat.key + '">' + cat.label + '</button>';
            }).join('') +
          '</div>' +
        '</div>' +
        (filtered.length ?
          '<div class="template-grid">' +
            filtered.map(function (t) {
              var label = categoryLabel(t.category);
              return (
                '<a class="template-tile" href="' + t.href + '" title="' + t.desc.replace(/"/g, '&quot;') + '">' +
                  '<span class="tile-thumb">' +
                    '<span class="thumb-band"></span>' +
                    '<span class="thumb-lines">' +
                      '<span class="w80"></span><span></span><span class="w60"></span>' +
                    '</span>' +
                  '</span>' +
                  (label ? '<span class="tile-category">' + label + '</span>' : '') +
                  '<span class="tile-title">' + t.title + '</span>' +
                '</a>'
              );
            }).join('') +
          '</div>' :
          '<div class="template-empty"><p>선택한 항목에 해당하는 템플릿이 아직 없습니다.</p></div>'
        );

      // 필터 버튼 클릭 처리 — 패널을 통째로 다시 그리므로(위 innerHTML),
      // 매번 새로 그려진 버튼에 리스너를 다시 붙여줍니다.
      var filterBtns = panel.querySelectorAll('.filter-btn');
      Array.prototype.forEach.call(filterBtns, function (btn) {
        btn.addEventListener('click', function () {
          currentFilterKey = btn.getAttribute('data-filter');
          renderTemplatePanel();
        });
      });
    }

    // 첫 화면에서 바로 확인할 수 있도록 다이즈하이미디어를 기본 선택.
    selectCompany('disehimedia', grid.querySelector('[data-company="disehimedia"]'));
  </script>
</body>
</html>
