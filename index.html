<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다이즈하이미디어 그룹 공식 문서 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Asta+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<!-- 색상·폰트 변수(--navy, --font-kr, --font-en)와 기본 리셋은
     shared/styles/variables.css에서 공통으로 가져옵니다. 이 페이지만의
     레이아웃(그룹사 선택 + 템플릿 미리보기)은 아래 <style>에 남겨둡니다. -->
<link rel="stylesheet" href="shared/styles/variables.css">
<style>
  /* variables.css의 기본 배경(#e9edf3)을 포털 페이지 전용 배경으로 덮어씀 */
  html{background:#f4f6fa;}
  body{
    background:#f4f6fa;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:60px 20px 40px;
  }

  /* ---------- 상단: 다이즈 로고 + 그룹 타이틀 ---------- */
  header{
    text-align:center;
    margin-bottom:44px;
  }
  .hero-logo{
    background-color:var(--navy);
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
    -webkit-mask-size:contain;mask-size:contain;
    margin:0 auto 18px;
  }
  header .eng{
    font-family:var(--font-en);
    color:#666;
    letter-spacing:2px;
    font-size:13px;
  }
  h1{
    color:var(--navy);
    margin:8px 0 0;
    font-size:25px;
  }
  header .lead{
    margin:10px 0 0;
    font-size:14px;
    color:var(--sub);
  }

  /* ---------- 그룹사 선택 카드 4개 ---------- */
  .company-grid{
    width:100%;
    max-width:720px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:16px;
    margin-bottom:8px;
  }
  /* ---------- 그룹사 선택 버튼(둥근 사각형 자체가 브랜드 컬러 바탕) ----------
     처음엔 흰 카드 안에 작은 원형 구슬 배지를 넣었었는데, 더 납작하고
     버튼 모서리 라운드 사각형 그대로가 바탕이 되는 형태로 변경했습니다.
     즉 .company-card 자체를 계열사 badgeColor(company-info.js)로 채우고,
     흰색 로고가 그 위에 살짝 돌출된(엠보싱) 느낌이 나도록 drop-shadow를
     겹쳐 입체감을 줍니다. 배경색은 인라인 style로 지정합니다. */
  .company-card{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border:none;
    border-radius:16px;
    padding:30px 16px;
    cursor:pointer;
    font-family:inherit;
    overflow:hidden;
    box-shadow:
      0 6px 16px rgba(15,20,35,.22),
      inset 0 1px 0 rgba(255,255,255,.2);
    transition:box-shadow .15s ease, transform .15s ease;
  }
  /* 위쪽에 살짝 밝은 유광 느낌만 얇게 — 구체가 아니라 납작한 판 위의
     은은한 광택이 되도록 그라데이션 폭을 넓고 옅게 잡았습니다. */
  .company-card::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,0) 60%);
    pointer-events:none;
  }
  .company-card:hover{
    box-shadow:
      0 10px 22px rgba(15,20,35,.28),
      inset 0 1px 0 rgba(255,255,255,.24);
    transform:translateY(-2px);
  }
  .company-card.active{
    box-shadow:
      0 0 0 3px #fff,
      0 0 0 5px var(--navy),
      0 10px 22px rgba(15,20,35,.3);
  }
  .company-logo{
    background-color:#fff;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
    -webkit-mask-size:contain;mask-size:contain;
    position:relative;
    z-index:1;
    /* 로고가 바탕에서 살짝 튀어나온 듯한 엠보싱 효과 — 아래쪽엔 진한
       그림자, 위쪽 가장자리엔 밝은 하이라이트를 겹쳐서 입체감을 줌 */
    filter:
      drop-shadow(0 2px 2px rgba(0,0,0,.35))
      drop-shadow(0 -1px 0 rgba(255,255,255,.35));
  }

  /* 회사명 텍스트는 화면에는 안 보이지만 스크린 리더 등 접근성 도구를
     위해 DOM에는 그대로 남겨둡니다(요청: "접근성을 위해서 정보만 남기고
     눈에는 로고만 보여도 됨"). */
  .sr-only{
    position:absolute;
    width:1px;height:1px;
    padding:0;margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  /* ---------- 하단: 선택한 그룹사의 문서 템플릿 ---------- */
  .template-panel{
    width:100%;
    max-width:880px;
    margin-top:28px;
  }
  .template-panel[hidden]{display:none;}

  /* 제목 줄과 필터 버튼을 한 줄에 — 좁은 화면에서는 줄바꿈되어
     필터가 제목 아래로 내려갑니다(flex-wrap). */
  .template-panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
  }
  .template-panel-head h2{
    font-size:15px;
    color:var(--sub);
    margin:0;
    font-weight:600;
  }
  .template-panel-head h2 b{color:var(--navy);}

  /* 항목별 필터(전체/공식서신/견적서/계약서 ...) — 새 카테고리가
     생기면 GROUPS 배열(subs)에만 추가하면 버튼이 자동으로
     늘어납니다. */
  .template-filter{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .filter-btn{
    font-family:var(--font-kr);
    font-size:12.5px;
    font-weight:600;
    color:var(--sub);
    background:#fff;
    border:1px solid #dde3ee;
    border-radius:999px;
    padding:6px 14px;
    cursor:pointer;
    transition:background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .filter-btn:hover{border-color:var(--navy);color:var(--navy);}
  .filter-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  /* 문서가 늘어나도 한눈에 훑어볼 수 있도록 리스트 대신 타일(그리드)
     형태로 배치 — 데스크톱 기준 5열, 좁은 화면에서는 열 수를
     줄입니다. */
  .template-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:14px;
  }
  @media (max-width:760px){
    .template-grid{grid-template-columns:repeat(3, 1fr);}
  }
  @media (max-width:480px){
    .template-grid{grid-template-columns:repeat(2, 1fr);}
  }

  .template-tile{
    display:flex;
    flex-direction:column;
    background:#fff;
    border:1px solid #e2e6ee;
    border-radius:10px;
    padding:10px;
    text-decoration:none;
    color:inherit;
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .template-tile:hover{
    box-shadow:0 6px 18px rgba(11,35,79,0.12);
    transform:translateY(-2px);
  }

  /* 실제 A4(가로 210mm × 세로 297mm) 비율을 그대로 축소한 미리보기 —
     문서 종류가 늘어도 이 클래스 하나로 항상 같은 비율을 유지합니다. */
  .tile-thumb{
    width:100%;
    aspect-ratio:210 / 297;
    background:#fff;
    border:1px solid #dde3ee;
    border-radius:5px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(20,30,60,0.08);
    margin-bottom:8px;
  }
  .thumb-band{height:24%;background:var(--navy);}
  .thumb-lines{padding:14% 14% 0;}
  .thumb-lines span{
    display:block;height:5px;background:#e2e6ee;border-radius:3px;margin-bottom:9px;
  }
  .thumb-lines span.w60{width:60%;}
  .thumb-lines span.w80{width:80%;}

  .tile-category{
    align-self:flex-start;
    font-size:10.5px;
    font-weight:700;
    color:var(--navy);
    background:#eef1f8;
    border-radius:4px;
    padding:2px 6px;
    margin-bottom:6px;
  }
  .tile-title{
    margin:0;
    font-size:12.5px;
    font-weight:600;
    line-height:1.4;
    color:var(--navy);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .template-empty{
    background:#fff;
    border:1px dashed #d3d9e6;
    border-radius:10px;
    padding:34px 20px;
    text-align:center;
  }
  .template-empty p{
    margin:0;
    font-size:14px;
    color:#888;
  }
  .template-empty p b{color:var(--sub);}

  footer{
    margin-top:48px;
    font-size:12px;
    color:#999;
    text-align:center;
  }

  /* ---------- 2026-10-28: 분류 개편(전체 | 디자인 양식 | 공식 문서 | 송장·견적서) ---------- */
  .company-text{position:relative;z-index:1;color:#fff;font-weight:700;font-size:15px;line-height:1.3;text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,.35);padding:6px 0;}
  .group-sec{margin-bottom:26px;}
  .group-sec h3{font-size:14px;color:var(--navy);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid #e2e6ee;}
  .group-sec h3 span{font-size:12px;font-weight:500;color:#999;margin-left:6px;}
  .sub-filter{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:-4px 0 16px;}
  .sub-hint{font-size:12px;color:#999;margin-right:4px;}
  .sub-btn{font-family:var(--font-kr);font-size:12px;font-weight:600;color:var(--sub);background:transparent;
    border:0;border-bottom:2px solid transparent;padding:5px 8px;cursor:pointer;}
  .sub-btn:hover{color:var(--navy);}
  .sub-btn.active{color:var(--navy);border-bottom-color:var(--navy);}
  .tile-thumb.design{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border:0;}
  .dz-logo{display:block;background:#fff;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;
    -webkit-mask-size:contain;mask-size:contain;transform:scale(1.4);}
  .dz-icon{color:#fff;font-size:30px;opacity:.9;}
  .tile-thumb.sheet .thumb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:12% 12% 0;}
  .tile-thumb.sheet .thumb-grid i{display:block;height:9px;background:#e2e6ee;border-radius:2px;}
  .template-tile.is-soon{opacity:.55;cursor:default;}
  .template-tile.is-soon:hover{box-shadow:none;transform:none;}
  .tile-soon{font-size:10.5px;color:#999;margin-top:4px;}
</style>
</head>
<body>
  <header>
    <div class="hero-logo" id="heroLogo"></div>
    <div class="eng">DISEHIMEDIA GROUP</div>
    <h1>다이즈하이미디어 그룹 공식 문서 시스템</h1>
    <p class="lead">그룹사를 선택하면 사용할 수 있는 문서 템플릿이 아래에 나타납니다.</p>
  </header>

  <div class="company-grid" id="companyGrid"></div>

  <div class="template-panel" id="templatePanel" hidden></div>

  <footer>&copy; DISEHIMEDIA GROUP. 내부 업무용 문서 시스템입니다. 제작 설정·기획 문서는 저장소의 docs/guide 폴더를 참고하세요.</footer>

  <!-- 계열사 정보(로고·이름)는 company-info.js 한 곳에서 관리합니다 —
       여기서는 그 값을 읽어 카드만 그립니다. 새 계열사가 추가되면
       company-info.js에 항목만 추가하면 이 페이지에도 자동으로 카드가
       늘어납니다. -->
  <script src="shared/scripts/company-info.js"></script>
  <!-- 계열사 계약서 목록(2026-10-23) — 아래 TEMPLATES_BY_COMPANY에 자동 추가 -->
  <script src="shared/scripts/contracts/common.js"></script>
  <script src="shared/scripts/contracts/r2v.js"></script>
  <script src="shared/scripts/contracts/bic.js"></script>
  <script>
    // ============================================================
    // 문서 분류 (2026-10-28 개편)
    //   전체 | 디자인 양식 | 공식 문서 | 송장·견적서
    //   - 디자인 양식: 회사 로고 · 명함 서식 · 프리젠테이션 (파일 내려받기)
    //   - 공식 문서  : 레터헤드 · 계약서 (워드처럼 작성)
    //   - 송장·견적서: 송장(인보이스) · 견적서 (엑셀처럼 계산)
    // 각 템플릿 항목의 category는 아래 subs의 key 중 하나입니다.
    // 새 분류가 생기면 해당 그룹의 subs에 { key, label }만 추가하면 됩니다.
    // ============================================================
    var GROUPS = [
      { key: 'design', label: '디자인 양식', hint: '파일 내려받기', thumb: 'design',
        subs: [{ key: 'logo', label: '회사 로고' }, { key: 'businesscard', label: '명함 서식' }, { key: 'presentation', label: '프리젠테이션' }] },
      { key: 'docs', label: '공식 문서', hint: '워드처럼 작성', thumb: 'doc',
        subs: [{ key: 'letterhead', label: '레터헤드' }, { key: 'contract', label: '계약서' }] },
      { key: 'sheets', label: '송장·견적서', hint: '엑셀처럼 계산', thumb: 'sheet',
        subs: [{ key: 'invoice', label: '송장(인보이스)' }, { key: 'quote', label: '견적서' }] }
    ];
    function groupOf(cat) {
      for (var i = 0; i < GROUPS.length; i++) {
        for (var j = 0; j < GROUPS[i].subs.length; j++) if (GROUPS[i].subs[j].key === cat) return GROUPS[i];
      }
      return null;
    }
    function subLabel(cat) {
      var g = groupOf(cat);
      if (!g) return '';
      return g.subs.filter(function (x) { return x.key === cat; })[0].label;
    }

    // 회사별 레터헤드 설명(디자인 차이) — 새 회사는 없으면 기본 문구
    var LH_DESC = {
      disehimedia: '헤더·푸터의 색을 빼고 다이즈블랙 로고만 남긴 국문 레터헤드입니다.',
      r2v: '왼쪽 가장자리에 R2V 그라데이션 세로 띠를 둔 디자인입니다.',
      bic: '하단에 BIC 그린 밴드를 둔 디자인입니다.',
      'axis-one': '모서리에 AXIS ONE 퍼플 삼각형 포인트를 둔 디자인입니다.'
    };

    // 회사별 템플릿 목록 — 모든 회사에 공통으로 만들고(새 회사도 company-info.js에
    // 추가하면 자동), 계약서만 shared/scripts/contracts/{회사}.js가 있는 회사에 붙습니다.
    var TEMPLATES_BY_COMPANY = {};
    Object.keys(DISE.companies).forEach(function (co) {
      var c = DISE.companies[co];
      var q = '?company=' + encodeURIComponent(co);
      TEMPLATES_BY_COMPANY[co] = [
        // 디자인 양식
        { title: '회사 로고', desc: 'AI 원본·SVG·PNG(투명)·JPG 로고 파일을 내려받습니다.', href: 'templates/logo/index.html' + q, category: 'logo' },
        { title: '명함 서식', desc: '준비 중입니다.', href: '', category: 'businesscard', soon: true },
        { title: '프리젠테이션 양식', desc: '회사 프리젠테이션 양식 파일을 내려받습니다.', href: 'templates/presentation/index.html' + q, category: 'presentation',
          soon: !(c.pptTemplates && c.pptTemplates.length) },
        // 공식 문서
        { title: '레터헤드 (국문)', desc: LH_DESC[co] || '회사 레터헤드 디자인의 국문 공식 문서입니다.', href: 'templates/gongmun-premium/index.html' + q, category: 'letterhead' },
        { title: '레터헤드 (영문)', desc: '"레터헤드 (국문)"과 같은 디자인의 영문 레터헤드입니다.', href: 'templates/gongmun/index.html' + q, category: 'letterhead' },
        // 송장·견적서
        { title: '송장 (인보이스)', desc: '구글 시트의 송장 데이터를 불러와 화면에서 고치고 인쇄·PDF로 내보냅니다.', href: 'templates/invoice/index.html' + q, category: 'invoice' },
        { title: '견적서', desc: '품목을 입력하면 공급가액·부가세·합계(한글 금액)가 자동 계산되는 표준 견적서입니다.', href: 'templates/quote/index.html' + q, category: 'quote' }
      ];
      ((DISE.contracts && DISE.contracts[co] && DISE.contracts[co].items) || []).forEach(function (it) {
        TEMPLATES_BY_COMPANY[co].push({
          title: it.title, desc: it.desc,
          href: 'templates/contract/index.html' + q + '&type=' + it.key,
          category: 'contract'
        });
      });
    });

    // 현재 선택된 그룹사/필터 — selectCompany()와 필터 버튼 클릭이 이
    // 값을 바꾸고, renderTemplatePanel()이 이 값을 기준으로 다시
    // 그립니다.
    var currentCompanyKey = null;
    var currentGroupKey = 'all';   // all | design | docs | sheets
    var currentSubKey = 'all';     // 그룹 안 세부 분류

    var LOGO_ROOT = 'shared/assets/logos/';

    function maskStyle(logoMark, heightPx, ratio) {
      var url = LOGO_ROOT + logoMark;
      var widthPx = Math.round(heightPx * (ratio || 1));
      return 'width:' + widthPx + 'px;height:' + heightPx + 'px;' +
        '-webkit-mask-image:url(\'' + url + '\');mask-image:url(\'' + url + '\');';
    }

    // ---- 상단 히어로 로고: 다이즈하이미디어 로고를 그룹 대표로 사용 ----
    var hero = DISE.companies.disehimedia;
    document.getElementById('heroLogo').setAttribute(
      'style', maskStyle(hero.logoMark, 44, hero.logoRatio)
    );

    // ---- 그룹사 카드 4개 ----
    var grid = document.getElementById('companyGrid');
    var companyKeys = Object.keys(DISE.companies);
    companyKeys.forEach(function (key) {
      var c = DISE.companies[key];
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'company-card';
      card.setAttribute('data-company', key);
      card.style.backgroundColor = c.badgeColor || 'var(--navy)';
      card.innerHTML =
        (c.logoMark ?
          '<span class="company-logo" style="' + maskStyle(c.logoMark, 46, c.logoRatio) + '"></span>' :
          // 로고 파일이 아직 없는 회사(새로 추가 중)는 회사명 글자로 표시
          '<span class="company-text">' + (c.nameKr || c.nameEn) + '</span>') +
        '<span class="company-name sr-only">' + c.nameEn +
          (c.nameKr && c.nameKr !== c.nameEn ? ' ' + c.nameKr : '') +
        '</span>';
      card.addEventListener('click', function () { selectCompany(key, card); });
      grid.appendChild(card);
    });

    // ---- 카드 클릭 시 하단 템플릿 패널 갱신 ----
    function selectCompany(key, card) {
      Array.prototype.forEach.call(grid.children, function (el) {
        el.classList.toggle('active', el === card);
      });
      currentCompanyKey = key;
      currentGroupKey = 'all'; // 그룹사를 바꾸면 분류도 "전체"로 초기화합니다.
      currentSubKey = 'all';
      renderTemplatePanel();
    }

    function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

    function thumbHTML(kind, cat) {
      var c = DISE.companies[currentCompanyKey];
      if (kind === 'design') {
        var icon = cat === 'logo' && c.logoMark ?
          '<span class="dz-logo" style="' + maskStyle(c.logoMark, 30, c.logoRatio) + '"></span>' :
          '<span class="dz-icon">' + (cat === 'businesscard' ? '▭' : cat === 'presentation' ? '▶' : '◆') + '</span>';
        return '<span class="tile-thumb design" style="background:' + (c.badgeColor || 'var(--navy)') + '">' + icon + '</span>';
      }
      if (kind === 'sheet') {
        return '<span class="tile-thumb sheet"><span class="thumb-band"></span><span class="thumb-grid">' +
          new Array(13).join('<i></i>') + '</span></span>';
      }
      return '<span class="tile-thumb"><span class="thumb-band"></span><span class="thumb-lines">' +
        '<span class="w80"></span><span></span><span class="w60"></span></span></span>';
    }

    function tileHTML(t) {
      var g = groupOf(t.category) || GROUPS[1];
      var inner = thumbHTML(g.thumb, t.category) +
        '<span class="tile-category">' + subLabel(t.category) + '</span>' +
        '<span class="tile-title">' + esc(t.title) + '</span>' +
        (t.soon ? '<span class="tile-soon">준비 중</span>' : '');
      return t.soon || !t.href ?
        '<div class="template-tile is-soon" title="' + esc(t.desc) + '">' + inner + '</div>' :
        '<a class="template-tile" href="' + t.href + '" title="' + esc(t.desc) + '">' + inner + '</a>';
    }

    // 현재 선택된 회사·분류 기준으로 패널(분류 버튼 + 타일)을 다시 그립니다.
    function renderTemplatePanel() {
      var c = DISE.companies[currentCompanyKey];
      var all = TEMPLATES_BY_COMPANY[currentCompanyKey] || [];
      var panel = document.getElementById('templatePanel');
      panel.hidden = false;

      var topBtns = [{ key: 'all', label: '전체' }].concat(GROUPS).map(function (g) {
        return '<button type="button" class="filter-btn' + (g.key === currentGroupKey ? ' active' : '') + '" data-group="' + g.key + '">' + g.label + '</button>';
      }).join('');

      var body = '';
      if (currentGroupKey === 'all') {
        // 전체: 그룹별 구역으로 나눠 보여줌
        body = GROUPS.map(function (g) {
          var items = all.filter(function (t) { var gg = groupOf(t.category); return gg && gg.key === g.key; });
          if (!items.length) return '';
          return '<section class="group-sec"><h3>' + g.label + ' <span>' + g.hint + '</span></h3>' +
            '<div class="template-grid">' + items.map(tileHTML).join('') + '</div></section>';
        }).join('');
      } else {
        var g = GROUPS.filter(function (x) { return x.key === currentGroupKey; })[0];
        var subBtns = [{ key: 'all', label: '전체' }].concat(g.subs).map(function (sb) {
          return '<button type="button" class="sub-btn' + (sb.key === currentSubKey ? ' active' : '') + '" data-sub="' + sb.key + '">' + sb.label + '</button>';
        }).join('');
        var items = all.filter(function (t) {
          var gg = groupOf(t.category);
          return gg && gg.key === g.key && (currentSubKey === 'all' || t.category === currentSubKey);
        });
        body = '<div class="sub-filter"><span class="sub-hint">' + g.hint + '</span>' + subBtns + '</div>' +
          (items.length ? '<div class="template-grid">' + items.map(tileHTML).join('') + '</div>' :
            '<div class="template-empty"><p>선택한 항목에 해당하는 양식이 아직 없습니다.</p></div>');
      }

      panel.innerHTML =
        '<div class="template-panel-head">' +
          '<h2><b>' + esc(c.nameKr) + '</b>의 문서·양식</h2>' +
          '<div class="template-filter">' + topBtns + '</div>' +
        '</div>' + body;

      Array.prototype.forEach.call(panel.querySelectorAll('.filter-btn'), function (btn) {
        btn.addEventListener('click', function () {
          currentGroupKey = btn.getAttribute('data-group');
          currentSubKey = 'all';
          renderTemplatePanel();
        });
      });
      Array.prototype.forEach.call(panel.querySelectorAll('.sub-btn'), function (btn) {
        btn.addEventListener('click', function () {
          currentSubKey = btn.getAttribute('data-sub');
          renderTemplatePanel();
        });
      });
    }

    // 처음 선택할 회사: 주소의 ?company= (로고·양식 페이지에서 돌아올 때), 없으면 다이즈하이미디어
    (function () {
      var m = /[?&]company=([^&]+)/.exec(location.search);
      var key = m && DISE.companies[decodeURIComponent(m[1])] ? decodeURIComponent(m[1]) : 'disehimedia';
      selectCompany(key, grid.querySelector('[data-company="' + key + '"]'));
    })();
  </script>
</body>
</html>
